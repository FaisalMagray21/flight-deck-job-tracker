<head>
<meta charset="UTF-8">

<title>Flight Deck — Job Application Tracker</title>
<meta name="description" content="Flight Deck — a free, local-first job application tracker. Track applications, get automatic follow-up reminders, and export your data. No sign-up, no server, your data stays in your browser.">
<meta name="keywords" content="job application tracker, job search tracker, track job applications, job hunt organizer, application tracker tool">
<meta name="author" content="Flight Deck">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://flight-deck-job-tracker.vercel.app/">

<!-- Favicon — "FD" logo, inline SVG, koi extra file nahi chahiye -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231A1D29'/%3E%3Ctext x='50' y='68' font-size='42' fill='%23FBBF24' text-anchor='middle' font-family='monospace' font-weight='bold'%3EFD%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231A1D29'/%3E%3Ctext x='50' y='68' font-size='42' fill='%23FBBF24' text-anchor='middle' font-family='monospace' font-weight='bold'%3EFD%3C/text%3E%3C/svg%3E">

<!-- Browser tab/address bar color (mobile pe status bar bhi) -->
<meta name="theme-color" content="#1A1D29">

<!-- Open Graph — jab link LinkedIn/WhatsApp pe share ho to preview ke liye -->
<meta property="og:title" content="Flight Deck — Job Application Tracker">
<meta property="og:description" content="Track your job applications with automatic follow-up reminders, stats, and CSV export. Fully local, fully private.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://flight-deck-job-tracker.vercel.app/">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Flight Deck — Job Application Tracker">
<meta name="twitter:description" content="Track your job applications with automatic follow-up reminders.">

<!-- Structured data — Google ko batata hai ye ek web application hai -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Flight Deck",
  "description": "A free, local-first job application tracker with automatic follow-up reminders, stats, and CSV export.",
  "url": "https://flight-deck-job-tracker.vercel.app/",
  "applicationCategory": "Productivity",
  "operatingSystem": "Any (Web Browser)",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  // Theme flash rokne ke liye — page render hone se pehle hi theme decide kar lete hain
  (function () {
    const saved = localStorage.getItem("flightdeck_theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const useDark = saved ? saved === "dark" : prefersDark;
    if (useDark) {
      document.documentElement.classList.add("dark");
    }
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          amber: { DEFAULT: '#FBBF24' },
          skyc: { DEFAULT: '#38BDF8' },
          jade: { DEFAULT: '#34D399' },
          rose: { DEFAULT: '#F87171' },
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        }
      }
    }
  }
</script>

<link rel="stylesheet" href="src/styles/style.css">
</head>
<body class="font-body bg-[#FAF7F0] dark:bg-[#0A0E1A] text-[#1A1D29] dark:text-[#E8EAED] transition-colors duration-300 min-h-screen">

  <div id="app"></div>

  <!-- Simple script tags — koi type="module" nahi.
       ORDER IMPORTANT HAI: pehle utils, phir baaki -->
  <script src="src/utils/storage.js"></script>
  <script src="src/utils/date.js"></script>
  <script src="src/constants/statusConfig.js"></script>
  <script src="src/utils/validators.js"></script>
  <script src="src/hooks/useApplications.js"></script>
  <script src="src/App.js"></script>
  <script src="src/index.js"></script>

  <!-- Vercel Analytics — plain HTML/JS ke liye script-tag tareeqa (npm nahi chahiye) -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
