<title>Flight Deck — Job Application Tracker</title>
<meta name="description" content="Flight Deck — a free, local-first job application tracker. Track applications, get automatic follow-up reminders, and export your data. No sign-up, no server, your data stays in your browser.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  // Theme flash rokne ke liye — page render hone se pehle hi theme decide kar lete hain
  (function () {
    const saved = localStorage.getItem("flightdeck_theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const useDark = saved ? saved === "dark" : prefersDark;
    if (useDark) {
      document.documentElement.classList.add("dark");
    }
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          amber: { DEFAULT: '#FBBF24' },
          skyc: { DEFAULT: '#38BDF8' },
          jade: { DEFAULT: '#34D399' },
          rose: { DEFAULT: '#F87171' },
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        }
      }
    }
  }
</script>
